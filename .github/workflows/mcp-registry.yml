name: Publish to MCP Registry

# Manual fallback: re-publish the version currently in package.json to the MCP
# registry, e.g. after a failed registry job in a release run. Re-running that job
# is NOT an option — it checks out the immutable tag, so a fix pushed to main would
# never reach it. The npm package for this version must already be published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for MCP registry OIDC authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync version from package.json into server.json
        run: |
          version="$(node -p "require('./package.json').version")"
          jq --arg v "$version" \
            '.version = $v
             | (.packages[] | select(.registryType != "oci") | .version) = $v
             | (.packages[] | select(.registryType == "oci")) |= (del(.version) | .identifier |= sub(":[^:]*$"; ":" + $v))' \
            server.json > server.tmp && mv server.tmp server.json
          jq -r '.packages[] | "\(.registryType) \(.identifier) \(.version // "-")"' server.json
      # Pinned to a release tag and checked against the checksum that release
      # published. `releases/latest/download` in a job holding `id-token: write`
      # runs whatever the upstream serves that day, with the OIDC token
      # available to it; and piping curl straight into tar means the bytes are
      # executed before anything has looked at them.
      #
      # Refresh both the tag and the digest together — a tag bumped without the
      # digest is a pin that verifies the wrong thing.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          rm -f "$archive"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
