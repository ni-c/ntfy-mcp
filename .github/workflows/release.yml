name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # Separate from `build`, which compiles only src/ into dist/. This also
      # typechecks test/, which vitest transpiles without checking.
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing — no NPM_TOKEN secret involved.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 ships npm >= 11.5.1, which Trusted Publishing requires.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches the package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      # --provenance requires a PUBLIC repository.
      - run: npm publish --provenance

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for MCP registry OIDC authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync version from package.json into server.json
        run: |
          version="$(node -p "require('./package.json').version")"
          # The registry rejects a 'version' field on OCI packages — their version
          # lives in the identifier tag instead. Touch BOTH package entries.
          jq --arg v "$version" \
            '.version = $v
             | (.packages[] | select(.registryType != "oci") | .version) = $v
             | (.packages[] | select(.registryType == "oci")) |= (del(.version) | .identifier |= sub(":[^:]*$"; ":" + $v))' \
            server.json > server.tmp && mv server.tmp server.json
          jq -r '.packages[] | "\(.registryType) \(.identifier) \(.version // "-")"' server.json
      # ci.yml pushes the image in a parallel run on the same tag, so the registry's
      # ownership check would race it. Wait until GHCR actually serves the tag.
      - name: Wait for the GHCR image tag
        run: |
          version="$(node -p "require('./package.json').version")"
          token="$(curl -fsS 'https://ghcr.io/token?scope=repository:ni-c/ntfy-mcp:pull&service=ghcr.io' | jq -r .token)"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/ni-c/ntfy-mcp/manifests/$version"; then
              echo "ghcr.io/ni-c/ntfy-mcp:$version is available"
              exit 0
            fi
            echo "waiting for ghcr.io/ni-c/ntfy-mcp:$version ($i/60)"
            sleep 30
          done
          echo "Image tag $version never appeared on GHCR — is ci.yml's publish job green?" >&2
          exit 1
      # Pinned to a release tag and checked against the checksum that release
      # published. `releases/latest/download` in a job holding `id-token: write`
      # runs whatever the upstream serves that day, with the OIDC token
      # available to it; and piping curl straight into tar means the bytes are
      # executed before anything has looked at them.
      #
      # Refresh both the tag and the digest together — a tag bumped without the
      # digest is a pin that verifies the wrong thing.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          rm -f "$archive"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" \
            '$0 ~ "^## \\[" ver "\\]" {flag=1; next} /^## \[/ {flag=0} flag' \
            CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No CHANGELOG section found for $version" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
